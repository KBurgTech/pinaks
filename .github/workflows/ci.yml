name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: pinaks
          POSTGRES_USER: pinaks
          POSTGRES_PASSWORD: pinaks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pinaks -d pinaks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pinaks:pinaks@localhost:5432/pinaks
      DJANGO_SETTINGS_MODULE: pinaks.settings.test
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      MUSTANG_CLI_JAR: /tmp/pinaks-mustang/Mustang-CLI-2.23.0.jar
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.12"
          python-version: "3.14"
          enable-cache: true
          cache-python: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: scripts/install-mustang-validator.sh /tmp/pinaks-mustang
      - run: uv sync --frozen --all-packages --all-groups
      - run: uv run ruff check backend
      - run: uv run ruff format --check backend
      - run: uv run mypy backend/src backend/tests
      - run: >-
          uv run pytest backend
          --cov=pinaks
          --cov-report=term-missing
          --cov-fail-under=80
          --cov-config=backend/pyproject.toml
      - run: uv run python backend/manage.py check --settings=pinaks.settings.test

  production-container:
    name: Production container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag pinaks:test .
      - run: >-
          docker run --rm --network none
          --volume "${{ github.workspace }}/backend/tests/fixtures/e_invoicing/representative-invoice.xml:/tmp/invoice.xml:ro"
          pinaks:test
          java -Djava.awt.headless=true
          -jar /opt/pinaks/mustang/Mustang-CLI-2.23.0.jar
          --action validate --source /tmp/invoice.xml
          --no-notices --disable-file-logging

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.5.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pinaks/web lint
      - run: pnpm --filter @pinaks/web format:check
      - run: pnpm --filter @pinaks/web typecheck
      - run: pnpm --filter @pinaks/web test --coverage
      - run: pnpm --filter @pinaks/web build
