services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://pinaks:pinaks@db:5432/pinaks
      DJANGO_SETTINGS_MODULE: pinaks.settings.development
    volumes:
      - .:/workspace:cached
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pinaks}
      POSTGRES_USER: ${POSTGRES_USER:-pinaks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pinaks}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
